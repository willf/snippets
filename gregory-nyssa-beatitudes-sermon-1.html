[quote]Ἰδὼν δὲ τοὺς ὄχλους, ἀνέβη εἰς τὸ ὄρος· καὶ καθίσαντος αὐτοῦ, προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ· καὶ ἀνοίξας τὸ στόμα αὐτοῦ, ἐδίδασκεν αὐτοὺς, λέγων· Μακάριοι οἱ πτωχοὶ τῷ πνεύματι, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.[/quote]

Τίς ἄρα τοιοῦτός ἐστιν ἐν τοῖς συνειλεγμένοις, ὡς μαθητής τε εἶναι τοῦ Λόγου, καὶ συναναβῆναι αὐτῷ χαμόθεν, ἀπὸ τῶν κοίλων τε καὶ ταπεινῶν νοημάτων, εἰς τὸ πνευματικὸν ὄρος τῆς ὑψηλῆς θεωρίας; Ὃ πᾶσαν μὲν σκιὰν τὴν ἐκ τῶν ὑπερανεστηκότων τῆς κακίας γεωλόφων ἐκπέφευγεν, ἁπανταχόθεν δὲ τῇ τοῦ ἀληθινοῦ φωτὸς ἀκτῖνι περιλαμπόμενον, ἐν καθαρᾷ τῇ τῆς ἀληθείας αἰθρίᾳ πάντα δίδωσιν ἐκ περιωπῆς καθορᾷν, ὅσα τοῖς ἐν τῷ κοίλῳ καθειργμένοις ἐστὶν ἀθέατα. Τὰ δὲ ἀπὸ τοῦ ὕψους τούτου κατοπτευόμενα, οἷα καὶ ὅσα ἐστὶν, αὐτὸς ὁ Θεὸς Λόγος, μακαρίζων τοὺς συναναβάντας αὐτῷ διεξέρχεται, οἷον δακτύλῳ τινὶ δεικνὺς, ἔνθεν μὲν τὴν τῶν οὐρανῶν βασιλείαν, ἑτέρωθεν δὲ, τῆς ἄνω γῆς τὴν κληρονομίαν· εἶτα ἔλεον, καὶ δικαιοσύνην, καὶ παράκλησιν, καὶ τὴν πρὸς τὸν Θεὸν τῶν ὅλων γινομένην συγγένειαν· καὶ τὸν ἐκ τῶν διωγμῶν καρπὸν, ὅ ἐστι τὸ σύνοικον Θεοῦ γενέσθαι· καὶ ὅσα ἄλλα πάρεστι πρὸς τούτοις βλέπειν, ἄνωθεν ἐκ τοῦ ὄρους δακτυλοδεικτοῦντος τοῦ Λόγου, ἐκ τῆς ὑψηλῆς σκοπιᾶς διὰ τῶν ἐλπίδων ἀποβλεπόμενον.

Ἐπειδὴ οὖν ἀναβαίνει εἰς τὸ ὄρος ὁ Κύριος, ἀκούσωμεν Ἡσαΐου βοῶντος· Δεῦτε, ἀναβῶμεν εἰς τὸ ὄρος τοῦ Κυρίου· κἂν ἀσθενῶμεν ἐξ ἁμαρτίας, ἐνισχύσωμεν, καθὼς ὑφηγεῖται ἡ προφητεία, χεῖρας παρειμένας καὶ γόνατα παραλελυμένα. Εἰ γὰρ ἐπὶ τοῦ ἄκρου γενοίμεθα, εὑρήσομεν τὸν ἰώμενον πᾶσαν νόσον καὶ πᾶσαν μαλακίαν, τὸν τὰς ἀσθενείας ἡμῶν ἀναλαμβάνοντα, καὶ τὰς νόσους βαστάζοντα. Οὐκοῦν δράμωμεν καὶ ἡμεῖς πρὸς τὴν ἄνοδον, ἵνα μετὰ Ἡσαΐου κατὰ τὴν ἀκρώρειαν τῆς ἐλπίδος γενόμενοι, ἴδωμεν ἐκ περιωπῆς τὰ ἀγαθὰ ἐκεῖνα, ὅσα τοῖς ἀκολουθήσασιν ἐπὶ τὸ ὕψος ὁ Λόγος δείκνυσιν. Ἀλλ’ ἀνοιξάτω καὶ ἡμῖν ὁ Θεὸς Λόγος τὸ στόμα, καὶ διδαξάτω ἡμᾶς ἐκεῖνα, ὧν ἡ ἀκρόασις μακαριότης ἐστίν· γενέσθω δὲ ἡμῶν ἀρχὴ τῆς θεωρίας, ἡ τῶν εἰρημένων τῆς διδασκαλίας ἀρχή.

Μακάριοι, φησὶ, οἱ πτωχοὶ τῷ πνεύματι, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν. Εἴ τις τῶν φιλοχρύσων γράμμασιν ἐντύχοι θησαυρὸν ἐν τόπῳ καταμηνύουσιν· ὁ δὲ περιέχων τὸν θησαυρὸν τόπος, πολὺν ἱδρῶτα καὶ πόνον ὑποδεικνύοι τοῖς ἐπιθυμοῦσι τοῦ κτήματος· ἆρα μαλακισθήσεται πρὸς τοὺς πόνους, καὶ καταρᾳθυμήσει τοῦ κέρδους, καὶ τὸ μηδένα κάματον ὑπὸ τῆς σπουδῆς εἰσενέγκασθαι, γλυκύτερον τοῦ πλούτου ποιήσεται; Οὐκ ἔστι ταῦτα, οὐκ ἔστιν· ἀλλὰ πάντας μὲν πρὸς τοῦτο παρακαλέσει τοὺς φίλους, πανταχόθεν δὲ ὡς ἂν οἷός τε ᾖ τὴν πρὸς τοῦτο βοήθειαν ἑαυτῷ συναγείρας τῷ πλήθει τῆς χειρὸς, ἴδιον ποιεῖται τὸν πλοῦτον τὸν κεκρυμμένον. Οὗτος ἐκεῖνός ἐστιν ὁ θησαυρὸς, ἀδελφοὶ, ὃν καταμηνύει τὸ γράμμα· κέκρυπται δὲ ὑπὸ τῆς ἀσαφείας ὁ πλοῦτος. Οὐκοῦν χρησώμεθα καὶ ἡμεῖς οἱ ἐπιθυμηταὶ τοῦ ἀκηράτου χρυσίου, τῇ τῶν εὐχῶν πολυχειρίᾳ, ὥστε ἡμῖν εἰς τὸ ἐμφανὲς τὸν πλοῦτον ἐλθεῖν, καὶ πάντας ἐξ ἴσου διελέσθαι τὸν θησαυρὸν, καὶ ὅλον ἕκαστον κτήσασθαι. Τοιαύτη γὰρ τῆς ἀρετῆς ἡ διαίρεσις, ὥστε καὶ εἰς πάντας τοὺς ἀντιποιουμένους διαμερίζεσθαι, καὶ πᾶσαν ἑκάστῳ παρεῖναι, μὴ ἐλαττουμένην ἐν τοῖς συμμετέχουσιν. Ἐν μὲν γὰρ τῇ τοῦ γηΐνου πλούτου διανομῇ ἀδικεῖ τοὺς ἰσομοιροῦντας ὁ τὸ πλέον παρασπασάμενος· ἐλαττοῖ γὰρ πάντως τὸ μέρος τοῦ συμμετέχοντος, ὁ τὸ ἑαυτοῦ πλεονάσας· ὁ δὲ πνευματικὸς πλοῦτος τὸ τοῦ ἡλίου ποιεῖ, καὶ πᾶσι τοῖς βλέπουσιν ἑαυτὸν μερίζων, καὶ ὅλος ἑκάστῳ παραγινόμενος. Ἐπεὶ οὖν ἴσον ἑκάστῳ τὸ ἐκ τοῦ πόνου κέρδος ἐλπίζεται, ἴση γενέσθω πᾶσιν διὰ τῶν εὐχῶν πρὸς τὸ ζητούμενον ἡμῖν ἡ συνέργεια.

Πρῶτον μὲν οὖν αὐτόν φημι ἐγὼ δεῖν τὸν μακαρισμὸν, ὅ τί ποτέ ἐστιν, ἐννοῆσαι. Μακαριότης τίς ἐστι, κατά γε τὸν ἐμὸν λόγον, περίληψις πάντων τῶν κατὰ τὸ ἀγαθὸν νοουμένων· ἧς ἄπεστι τῶν εἰς ἀγαθὴν ἐπιθυμίαν ἡκόντων οὐδέν. Γένοιτο δ’ ἂν ἡμῖν καὶ ἐκ τῆς τοῦ ἐναντίου παραθέσεως γνωριμώτερον τὸ ἐκ τοῦ μακαρισμοῦ σημαινόμενον· ἐναντίον δὲ τῷ μακαρίῳ τὸ ἄθλιον. Ἀθλιότης οὖν ἐστιν, ἡ ἐν τοῖς λυπηροῖς τε καὶ ἀβουλήτοις πάθεσι ταλαιπωρία. Μεμέρισται δὲ ἐκ τοῦ ἐναντίου ἡ ἐφ’ ἑκατέρου τῶν ἐν αὐτοῖς γινομένων διάθεσις. Ὑπάρχει γὰρ τῷ μὲν μακαριζομένῳ τὸ εὐφραίνεσθαι τοῖς προκειμένοις εἰς ἀπόλαυσιν αὐτῷ καὶ ἀγάλλεσθαι· τῷ δὲ ταλανιζομένῳ τὸ ἀνιᾶσθαι τοῖς παροῦσιν αὐτῷ καὶ ἀλγύνεσθαι. Τὸ μὲν οὖν μακαριστὸν ἀληθῶς, αὐτὸ τὸ Θεῖόν ἐστιν. Ὅ τί ποτε γὰρ αὐτὸ εἶναι ὑποθώμεθα, μακαριότης ἐστὶν ἡ ἀκήρατος ἐκείνη ζωὴ, τὸ ἄῤῥητόν τε καὶ ἀκατανόητον ἀγαθὸν, τὸ ἀνέκφραστον κάλλος, ἡ αὐτοχάρις, καὶ σοφία, καὶ δύναμις· τὸ ἀληθινὸν φῶς· ἡ πηγὴ πάσης ἀγαθότητος· ἡ ὑπερκειμένη τοῦ παντὸς ἐξουσία· τὸ μόνον ἐράσμιον, τὸ ἀεὶ ὡσαύτως ἔχον, τὸ διηνεκὲς ἀγαλλίαμα· ἡ ἀΐδιος εὐφροσύνη· περὶ ἧς πάντα τις ἃ δύναται λέγων, λέγει τῶν κατ’ ἀξίαν οὐδέν. Οὔτε γὰρ ἡ διάνοια καθικνεῖται τοῦ ὄντος, κἄν τι περὶ αὐτοῦ τῶν ὑψηλοτέρων νοῆσαι χωρήσωμεν, οὐδενὶ λόγῳ τὸ νοηθὲν ἐξαγγέλλεται. Ἐπεὶ δὲ ὁ πλάσας τὸν ἄνθρωπον, κατ’ εἰκόνα Θεοῦ ἐποίησεν αὐτόν· δευτέρως ἂν εἴη μακαριστὸν τὸ κατὰ μετουσίαν τῆς ὄντως μακαριότητος ἐν τῷ ὀνόματι τούτῳ γινόμενον. Ὥσπερ γὰρ ἐπὶ τῆς σωματικῆς εὐμορφίας, τὸ μὲν πρωτότυπον κάλλος ἐν τῷ ζῶντι προσώπῳ ἐστὶ καὶ ὑφεστῶτι, δευτερεύει δὲ τούτου τὸ κατὰ μίμησιν ἐπὶ τῆς εἰκόνος δεικνύμενον· οὕτως καὶ ἡ ἀνθρωπίνη φύσις, εἰκὼν οὖσα τῆς ὑπερκειμένης μακαριότητος, καὶ αὐτὴ τῷ ἀγαθῷ κάλλει χαρακτηρίζεται, ὅταν ἐφ’ ἑαυτῆς δεικνύει τὰς τῶν μακαρίων χαρακτήρων ἐμφάσεις. Ἀλλ’ ἐπειδὴ ὁ τῆς ἁμαρτίας ῥύπος τὸ ἐπὶ εἰκόνος κάλλος ἠχρείωσεν· ἦλθεν ὁ ἐκνίπτων ἡμᾶς τῷ ἰδίῳ ὕδατι, τῷ ζῶντί τε καὶ ἁλλομένῳ εἰς ζωὴν αἰώνιον, ὥστε ἡμᾶς ἀποθεμένους τὸ ἐξ ἁμαρτίας αἶσχος, πάλιν κατὰ τὴν μακαρίαν ἀνακαινισθῆναι μορφήν. Καὶ καθάπερ ἐπὶ τῆς ζωγραφικῆς τέχνης εἴποι ἄν気がする πρὸς τοὺς ἀπείρους ὁ ἐπιστήμων, ἐκεῖνο καλὸν εἶναι τὸ πρόσωπον, τὸ ἐκ τοιῶνδε τῶν τοῦ σώματος μορίων συγκείμενον· ᾧ κόμη τε τοιάδε, καὶ ὀφθαλμῶν κύκλοι, καὶ ὀφρύων περιγραφαὶ, καὶ παρειῶν θέσις, καὶ τὰ καθ’ ἕκαστον πάντα δι’ ὧν συμπληροῦται ἡ εὐμορφία· οὕτως καὶ ὁ τὴν ἡμετέραν πρὸς τὴν τοῦ μόνου μακαρίου μίμησιν ἀναζωγραφῶν ψυχὴ, τὰ καθ’ ἕκαστον τῶν εἰς μακαρισμὸν συντεινόντων, ὑπογράφει τῷ λόγῳ, καί φησιν ἐν πρώτοις· Μακάριοι οἱ πτωχοὶ τῷ πνεύματι, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.

Ἀλλὰ τί κέρδος ἐκ τῆς μεγαλοδωρεᾶς γενήσεται, μὴ φανερωθείσης ἡμῖν τῆς ἐγκειμένης διανοίας τῷ λόγῳ; Καὶ γὰρ ἐπὶ τῆς ἰατρικῆς, πολλὰ τῶν τιμίων καὶ δυσπορίστων φαρμάκων ἄχρηστα τοῖς ἀγνοοῦσι καὶ ἀνόνητα μένει, ἕως ἂν εἰς ὅ τι χρήσιμον ἕκαστον τούτων ἐστὶν παρὰ τῆς τέχνης ἀκούσωμεν. Τί οὖν ἐστι τὸ πτωχεῦσαι τῷ πνεύματι, δι’ οὗ περιγίνεται τὸ τῆς βασιλείας τῶν οὐρανῶν ἐγκρατῆ γενέσθαι; Δύο πλούτους παρὰ τῆς Γραφῆς μεμαθήκαμεν· ἕνα σπουδαζόμενον, καὶ ἕνα κατακρινόμενον. Σπουδάζεται μὲν ὁ τῶν ἀρετῶν πλοῦτος, διαβάλλεται δὲ ὁ ὑλικός τε καὶ γήϊνος· ὅτι ὁ μὲν τῆς ψυχῆς γίνεται κτῆμα, οὗτος δὲ πρὸς τὴν τῶν αἰσθητηρίων ἀπάτην ἐπιτηδείως ἔχει. Διὸ κωλύει τοῦτον θησαυρίζειν ὁ Κύριος, ὡς εἰς βρῶσιν σητῶν καὶ εἰς ἐπιβουλὴν τῶν τοιχωρυχούντων ἐκκείμενον. Κελεύει δὲ περὶ τὸν τῶν ὑψηλῶν πλοῦτον τὴν σπουδὴν ἔχειν, οὗ ἡ φθαρτικὴ δύναμις οὐ προσάπτεται. Σῆτα δὲ καὶ κλέπτην εἰπὼν, τὸν λυμεῶνα τῶν τῆς ψυχῆς θησαυρῶν ἐνεδείξατο. Εἰ οὖν ἀντιδιαστέλλεται ἡ πενία τῷ πλούτῳ, πάντως κατὰ τὴν ἀναλογίαν καὶ διπλῆν ἔστι διδαχθῆναι πενίαν· τὴν μὲν ἀπόβλητον, τὴν δὲ μακαριζομένην. Ὁ μὲν οὖν σωφροσύνης πτωχεύων, ἢ τοῦ τιμίου κτήματος τῆς δικαιοσύνης, ἢ τῆς σοφίας, ἢ τῆς φρονήσεως, ἢ ἄλλου τινὸς τῶν πολυτελῶν κειμηλίων πένης τε καὶ ἀκτήμων καὶ πτωχὸς εὑρισκόμενος, ἄθλιος τῆς πενίας καὶ ἐλεεινὸς τῆς τῶν τιμίων ἀκτημοσύνης· ὁ δὲ πάντων τῶν κατὰ κακίαν νοουμένων ἑκουσίως πτωχεύων, καὶ οὐδὲν τῶν διαβολικῶν κειμηλίων ἐν τοῖς ἰδίοις ταμείοις ἔχων ἀπόθετον, ἀλλὰ τῷ πνεύματι ζέων, καὶ διὰ τούτου τὴν τῶν κακῶν πενίαν ἑαυτῷ θησαυρίζων, εἴη ἂν οὗτος ἐν τῇ μακαριζομένῃ πτωχείᾳ ὑπὸ τοῦ Λόγου δεικνύμενος, ἧς ὁ καρπὸς βασιλεία οὐρανῶν ἐστιν.

Ἀλλ’ ἐπανέλθωμεν πάλιν ἐπὶ τὴν ἐργασίαν τοῦ θησαυροῦ, καὶ μὴ ἀποστῶμεν τῷ μεταλλευτικῷ λόγῳ τὸ κεκρυμμένον ἀνακαλύπτοντες. Μακάριοι, φησὶ, οἱ πτωχοὶ τῷ πνεύματι. Εἴρηται μὲν τρόπον τινὰ τοῦτο καὶ ἐν τοῖς ἔμπροσθεν, καὶ νῦν πάλιν εἰρήσεται, ὅτι τέλος τοῦ κατ’ ἀρετὴν βίου ἐστὶν ἡ πρὸς τὸ Θεῖον ὁμοίωσις. Ἀλλὰ μὴν τὸ ἀπαθὲς καὶ ἀκήρατον ἐκφεύγει πάντη τὴν παρὰ ἀνθρώπων μίμησιν. Οὐδὲ γάρ ἐστι δυνατὸν πάντη τὴν ἐμπαθῆ ζωὴν ὁμοιωθῆναι πρὸς τὴν τῶν παθῶν ἀνεπίδεκτον φύσιν. Εἰ οὖν μόνον τὸ Θεῖον μακάριον, καθὼς ὁ Ἀπόστολος ὀνομάζει, ἡ δὲ τοῦ μακαρισμοῦ κοινωνία τοῖς ἀνθρώποις διὰ τῆς πρὸς τὸν Θεόν ἐστιν ὁμοιώσεως, ἡ δὲ μίμησις ἄπορος· ἄρα ἀνέφικτός ἐστιν ἡ μακαριότης τῇ ἀνθρωπίνῃ ζωῇ. Ἀλλ’ ἔστιν ἃ τῆς Θεότητος δυνατὰ τοῖς βουλομένοις πρόκειται εἰς μίμησιν. Τίνα οὖν ἐστι ταῦτα; δοκεῖ μοι πτωχείαν πνεύματος, τὴν ἑκούσιον ταπεινοφροσύνην ὀνομάζειν ὁ Λόγος. Ταύτης δὲ ὑπόδειγμα τὴν τοῦ Θεοῦ πτωχείαν ὁ Ἀπόστολος ἡμῖν λέγων προδείκνυσιν, ὃς δι’ ἡμᾶς ἐπτώχευσε πλούσιος ὢν, ἵνα ἡμεῖς τῇ ἐκείνου πτωχείᾳ πλουτήσωμεν. Ἐπεὶ οὖν τὰ ἄλλα πάντα, ὅσα περὶ τὴν θείαν καθορᾶται φύσιν, ὑπερπίπτει τῷ μέτρῳ τῆς ἀνθρωπίνης φύσεως· ἡ δὲ ταπεινότης συμφυής τις ἡμῖν ἐστι καὶ σύντροφος τοῖς χαμαὶ ἐρχομένοις, καὶ ἐκ γῆς τὴν σύστασιν ἔχουσιν, καὶ εἰς γῆν καταῤῥέουσιν· ἐν τῷ κατὰ φύσιν σὺ καὶ δυνατῷ τὸν Θεν μιμησάμενος, τὴν μακαρίαν αὐτὸς ὑπέδυς μορφήν. Καὶ μηδεὶς ἄπονον οἰέσθω, καὶ μετὰ ῥᾳστώνης ἐκποριζόμενον τὸ τῆς ταπεινοφροσύνης κατόρθωμα. Τὸ ἐναντίον μὲν οὖν παντὸς οὑτινοσοῦν τῶν κατ’ ἀρετὴν ἐπιτηδευομένων, τὸ τοιοῦτόν ἐστιν ἐπιπονώτερον. Διὰ τί; ὅτι καθεύδοντος τοῦ ἀνθρώπου, τοῦ τὰ καλὰ σπέρματα δεξαμένου, τὸ κεφάλαιον τῆς ἐναντίας σπορᾶς παρὰ τοῦ ἐχθροῦ τῆς ζωῆς ἡμῶν τὸ τῆς ὑπερηφανίας ἐῤῥιζώθη ζιζάνιον. Δι’ ὧν γὰρ ἐκεῖνος ἑαυτὸν εἰς γῆν κατέῤῥαξεν, τῷ αὐτῷ τρόπῳ τὸ δείλαιον γένος τὸ ἀνθρώπινον πρὸς τὸ κοινὸν πτῶμα ἑαυτῷ συγκατέβαλεν· καὶ οὐδέν ἐστιν ἄλλο τῆς φύσεως ἡμῶν τοιοῦτον κακὸν, ὡς τὸ δι’ ὑπερηφανίας. Ἐπεὶ οὖν ἐμπέφυκέ πως τὸ κατὰ τὴν ἔπαρσιν πάθος παντὶ σχεδὸν τῷ κοινωνοῦντι τῆς ἀνθρωπίνης φύσεως, διὰ τοῦτο ἐντεῦθεν τῶν μακαρισμῶν ὁ Κύριος ἄρχεται, οἷον ἀρχέγονόν τι κακὸν ἐκβάλλων ἐκ τῆς ἕξεως ἡμῶν τὴν ὑπερηφανίαν, ἐν τῷ συμβουλεύειν μιμήσασθαι τὸν ἑκουσίως πτωχεύσαντα, ὅς ἐστιν ἀληθῶς μακάριος, ἵνα ἐν ᾧ δυνάμεθα καθὼς ἂν οἷοί τε ὦμεν ὁμοιωθέντες ἐκ τοῦ πτωχεῦσαι κατὰ προαίρεσιν, καὶ τὴν τοῦ μακαρισμοῦ κοινωνίαν ἐφελκυσώμεθα. Τοῦτο γὰρ φρονείσθω, φησὶ, ἐν ὑμῖν, ὃ καὶ ἐν Χριστῷ Ἰησοῦ· ὃς ἐν μορφῇ Θεοῦ ὑπάρχων, οὐχ ἁρπαγμὸν ἡγήσατο τὸ εἶναι ἴσα Θεῷ· ἀλλ’ ἑαυτὸν ἐκένωσε μορφὴν δούλου λαβών. Τί πτωχότερον ἐπὶ Θεοῦ τῆς τοῦ δούλου μορφῆς; Τί ταπεινότερον ἐπὶ τοῦ βασιλέως τῶν ὄντων, ἢ τὸ εἰς κοινωνίαν τῆς πτωχῆς ἡμῶν φύσεως ἐλθεῖν; Ὁ Βασιλεὺς τῶν βασιλευόντων, καὶ Κύριος τῶν κυριευόντων ἐθελόντως τὴν τῆς δουλείας μορφὴν ὑποδύεται· ὁ Κριτὴς τοῦ παντὸς, ὑπόφορος τοῖς δυναστεύουσι γίνεται· ὁ τῆς κτίσεως Κύριος ἐν σπηλαίῳ κατάγεται· ὁ τοῦ παντὸς περιδεδραγμένος οὐχ εὑρίσκει τόπον ἐν τῷ καταλύματι, ἀλλ’ ἐν τῇ φάτνῃ τῶν ἀλόγων ζώων παραῤῥιπτείται· ὁ καθαρὸς καὶ ἀκήρατος, τὸν τῆς ἀνθρωπίνης φύσεως καταδέχεται ῥύπον, καὶ διὰ πάσης τῆς πτωχείας ἡμῶν διεξελθὼν μέχρι τῆς τοῦ θανάτου πρόεισι πείρας. Ὁρᾶτε τῆς ἑκουσίου πτωχείας τὸ μέτρον. Ἡ ζωὴ θανάτου γεύεται· ὁ Κριτὴς εἰς κριτήριον ἄγεται· ὁ τῆς ζωῆς τῶν ὄντων Κύριος ἐπὶ τῇ ψήφῳ τοῦ δικάζοντος γίνεται· ὁ πάσης τῆς ὑπερκοσμίου δυνάμεως Βασιλεὺς τὰς τῶν δημίων οὐκ ἀπωθεῖται χεῖρας. Πρὸς τοῦτό σοι, φησὶ, τὸ ὑπόδειγμα, τὸ τῆς ταπεινοφροσύνης βλεπέτω μέτρον.

Τάχα δέ μοι δοκεῖ καλῶς ἔχειν καὶ τὴν ἀλογίαν τοῦ τοιούτου διασκοπῆσαι πάθους, ὡς ἂν εὐκατόρθωτος ἡμῖν ὁ μακαρισμὸς γένοιτο, σὺν εὐμαρείᾳ πολλῇ καὶ ῥᾳστώνῃ τῆς ταπεινοφροσύνης κατορθουμένης. Καθάπερ γὰρ οἱ ἐπιστήμονες τῶν ἰατρῶν, τὸ νοσοποιὸν αἴτιον προεξελόντες, ῥᾷον ἐπικρατοῦσι τοῦ πάθους· οὕτως καὶ ἡμεῖς τὴν χαυνότητα τῶν τυφουμένων τῷ λογισμῷ καταστείλαντες, εὐεπίβατον ἑαυτοῖς τὴν τῆς ταπεινοφροσύνης ὁδὸν καταστήσωμεν. Πόθεν οὖν ἄν τις μᾶλλον ἐπιδείξειε τοῦ τύφου τὸ μάταιον; Πόθεν ἄλλοθεν, ἢ ἐκ τοῦ δεῖξαι τὴν φύσιν, ἥτις ἐστίν; Ὁ γὰρ πρὸς ἑαυτὸν, καὶ μὴ τὰ περὶ αὑτὸν βλέπων, οὐκ ἂν εὐλόγως εἰς τὸ τοιοῦτον ἐμπέσοι πάθος. Τί οὖν ἐστιν ἄνθρωπος; Βούλει τὸν σεμνότερον καὶ τιμιώτερον εἴπω τῶν λόγων; Ἀλλ’ ὁ κοσμῶν τὰ ἡμέτερα, καὶ πρὸς τὸ κομπωδέστερον διασκευάζων τὴν ἀνθρωπίνην εὐγένειαν, ἐκ πηλοῦ γενεαλογεῖ τὴν φύσιν· καὶ ἡ εὐγένεια, καὶ ἡ σεμνότης τοῦ ὑπερηφάνου, τὸ συγγενὲς πρὸς τὴν πλίνθον ἔχει. Εἰ δὲ τὴν προσεχῆ τε καὶ πρόχειρον τῆς γενέσεως εἰπεῖν ἐθέλοις, ἄπαγε, μὴ φθέγξῃ περὶ τούτου· μὴ γρύξῃς, μὴ ἀνακαλύψῃς, καθώς φησιν ὁ νόμος, ἀσχημοσύνην πατρὸς καὶ μητρός σου· μὴ δημοσιεύσῃς τῷ λόγῳ τὰ λήθης ἄξια καὶ βαθείας σιγῆς. Εἶτα οὐκ ἐρυθριᾷς, ὁ γήϊνος ἀνδριὰς, ὁ μετ’ ὀλίγον κόνις, ὁ πομφόλυγος δίκην ὠκύμορον ἐν σεαυτῷ περιέχων τὸ φύσημα, πλήρης ὑπερηφανίας γινόμενος, καὶ περιφλεγμαίνων τῷ τύφῳ, καὶ τῷ ματαίῳ φρονήματι ἐξογκῶν τὴν διάνοιαν. Οὐχ ὁρᾷς εἰς ἀμφότερα τῆς ζωῆς τοῦ ἀνθρώπου τὰ πέρατα, καὶ ὅπως ἄρχεται, καὶ εἰς ὅ τι λήγει; Ἀλλὰ γαυριᾷς τῇ νεότητι, καὶ πρὸς τὸ ἄνθος τῆς ἡλικίας βλέπεις, καὶ ἐγκαλλωπίζῃ τῇ ὥρᾳ, ὅτι σοι ὑπερσφριγῶσιν αἱ χεῖρες πρὸς κίνησιν, καὶ κοῦφοι πρὸς τὸ ἅλμα οἱ πόδες, καὶ περισοβεῖ ταῖς αὔραις ὁ βόστρυχος, καὶ τὴν παρειὰν ὑπογράφει ὁ ἴουλος, καὶ ὅτι σοι ἡ ἐσθὴς τῇ βαφῇ τῆς πορφύρας ὑπερανθίζεται, καὶ πεποίκιλταί σοι τὰ ἐκ σηρῶν ὑφάσματα, πολέμοις ἢ θήραις, ἤ τισιν ἱστορίαις πεποικιλμένα, ἢ τάχα καὶ πρὸς τὰ πέδιλα βλέπεις ἐπιμελῶς ἐν τῷ μέλανι στίλβοντα, καὶ περιέργως ταῖς ἀπὸ τῶν ῥαφίδων γραμμαις ἐπιτέρποντα; Πρὸς ταῦτα βλέπεις, πρὸς δὲ σεαυτὸν οὐχ ὁρᾷς; Δείξω σοι ὥσπερ ἐν κατόπτρῳ, τίς εἶ καὶ οἷος εἶ.

Οὐκ εἶδες ἐν πολυανδρίῳ τὰ τῆς φύσεως ἡμῶν μυστήρια; οὐκ εἶδες τὴν ἐπάλληλον τῶν ὀστέων σωρείαν; κρανία σαρκῶν γεγυμνωμένα, φόβερόν τι καὶ εἰδεχθὲς ἐν διακένοις δεδορκότα τοῖς ὄμμασιν; Εἶδες στόματα σεσηρότα, καὶ τὰ λοιπὰ τῶν μελῶν πρὸς τὸ συμβὰν πεφορημένα; Εἰ ἐκεῖνα εἶδες, σεαυτὸν ἐν ἐκείνοις τεθέασαι. Ποῦ τοῦ παρόντος ἄνθους τὰ σύμβολα; ποῦ ἡ εὔχροια τῆς παρειᾶς; ποῦ τὸ ἐπὶ τοῦ χείλους ἄνθος; ποῦ τὸ βλοσυρὸν ἐν τοῖς ὄμμασι κάλλος τῇ περιβολῇ τῶν ὀφρύων ὑπολαμπόμενον; ποῦ ἡ εὐθεῖα ῥὶς, ἡ τῷ κάλλει τῶν παρειῶν μεσιτεύουσα; ποῦ αἱ ἐπαυχένιοι κόμαι; ποῦ οἱ περικροτάφιοι βόστρυχοι; ποῦ αἱ τοξαζόμεναι χεῖρες; οἱ ἱππαζόμενοι πόδες; ἡ πορφύρα; ἡ βύσσος; ἡ χλανίς; ἡ ζώνη; τὰ πέδιλα; ὁ ἵππος; ὁ δρόμος; τὸ φρύαγμα; πάντα, δι’ ὧν σοι νῦν ὁ τῦφος αὔξεται; Ποῦ ταῦτα ἐν ἐκείνοις, εἰπὲ, ὑπὲρ ὧν νῦν ἐπαίρῃ καὶ μεγαλοφρονεῖς; Ποῖον οὕτως ἀνυπόστατον ὄναρ; Ποῖα τοιαῦτα ἐξ ὕπνου φαντάσματα; Τίς οὕτως ἀδρανὴς σκιὰ τὴν ἁφὴν ὑποφεύγουσα, ὡς τὸ τῆς νεότητος ὄναρ ὁμοῦ τε φαινόμενον καὶ εὐθὺς παριπτάμενον; Ταῦτά μοι πρὸς τοὺς ἐν νεότητι διὰ τὸ ἀτελὲς τῆς ἡλικίας ἀφραίνοντας. Τί δ’ ἄν τις εἴποι περὶ τῶν ἤδη καθεστηκότων, οἷς ἡ μὲν ἡλικία βέβηκεν, ἀστατεῖ δὲ τὸ ἦθος, καὶ ἡ νόσος τῆς ὑπερηφανίας αὔξεται· ὄνομα δὲ τῇ τοιαύτῃ ἀῤῥωστίᾳ τοῦ ἤθους φρόνημα τίθενται· ἀρχὴ δὲ ὡς ἐπιτοπολὺ καὶ ἡ κατ’ αὐτὴν δυναστεία, ἡ τῆς ὑπερηφανίας ὑπόθεσις γίνεται. Ἢ γὰρ ἐν αὐτῇ τοῦτο πάσχουσιν, ἢ πρὸς αὐτην ἑτοιμάζονται, ἢ τὰ περὶ αὐτῆς διηγήματα καὶ παυσαμένην ἤδη πολλάκις ἀναῤῥιπίζει τὴν νόσον. Καὶ τίς λόγος τοιοῦτος, ὡς ἐντὸς γενέσθαι τῆς ἀκοῆς αὐτῶν, τῆς ὑπὸ τῆς φωνῆς τῶν κηρύκων προβεβυσμένης; Τίς πείσει τοὺς οὕτως ἔχοντας, ὅτι τῶν ἐπὶ σκηνῆς πομπευόντων οὐδ’ ὁτιοῦν διαφέρουσι; Καὶ γὰρ ἐκείνοις καὶ πρόσωπόν τι ἐκ τέχνης τῶν γλαφυρῶν ἐπιβέβληται, καὶ ἁλουργὶς χρυσόπαστος, καὶ ἐπὶ ἅρματος ἡ πομπὴ, καὶ ὅμως οὐδεμία νόσος αὐτοῖς ὑπερηφανίας ἐκ τῶν τοιούτων εἰσέρχεται· ἀλλ’ οἷοι πρὸ τῆς σκηνῆς ἦσαν τὸ φρόνημα, ἴσην ἐπὶ τῇ ψυχῇ τὴν ἕξιν καὶ ἐπὶ τῆς πομπῆς διεσώσαντο, καὶ μετὰ τοῦτο οὐκ ἀνιῶνται, τοῦ τε ἅρματος ἀποβάντες, καὶ τὸ σχῆμα περιαιρούμενοι. Οἱ δὲ διὰ τῆς ἀρχῆς πομπεύοντες ἐν τῇ τοῦ βίου σκηνῇ, οὔτε τὸ πρὸ βραχέος, οὔτε τὸ μετὰ βραχὺ λογιζόμενοι, καθάπερ τῷ φυσήματι αἱ πομφόλυγες περιτείνονται· τὸν αὐτὸν τρόπον καὶ οὗτοι περιογκοῦνται τῇ μεγαλοφωνίᾳ τοῦ κήρυκος, καὶ ἀλλοτρίου τινὸς προσωπείου μορφὴν ἑαυτοῖς περιπλάσσουσιν, ἐξαλλάσσοντες τὴν κατὰ φύσιν τοῦ προσώπου θέσιν εἰς τὸ ἀμειδὲς καὶ ἐπίφοβον, φθόγγος τε αὐτοῖς ἐπινοεῖται τραχύτερος, πρὸς τὴν τῶν ἀκουόντων κατάπληξιν ἐπὶ τὸ θηριῶδες μετατυπούμενος· οὐκέτι ἐν τοῖς ἀνθρωπίνοις μένουσιν ὅροις, ἀλλ’ εἰς τὴν θείαν δύναμίν τε καὶ ἐξουσίαν ἑαυτοὺς εἰσποιοῦσιν. Ζωῆς γὰρ καὶ θανάτου κύριοι εἶναι πιστεύουσιν, ὅτι τῶν ἐν αὐτοῖς κρινομένων τῷ μὲν τὴν σώζουσαν νέμουσι ψῆφον, τὸν δὲ θανάτῳ καταδικάζουσι· καὶ οὐδὲ τοῦτο βλέπουσι, τίς ἀληθῶς τῆς ἀνθρωπίνης ζωῆς κύριος, ὁ καὶ τὴν ἀρχὴν τοῦ εἶναι καὶ τὸ τέλος ὁρίζων· καίτοι γε τοῦτο μόνον ἱκανὸν ἦν εἰς καταστολὴν τῆς χαυνότητος, τὸ πολλοὺς ἰδεῖν τῶν ἀρχόντων ἐν αὐτῇ τῇ τῆς ἀρχῆς σκηνῇ ἐκ μέσων ἁρπασθέντας τῶν θρόνων, καὶ ἐπὶ τοὺς τάφους ἐκκομισθέντας, ἐφ’ ὧν ὁ θρῆνος τὰς τῶν κηρύκων φωνὰς διεδέξατο.

Πῶς οὖν ἀλλοτρίας ζωῆς κύριος ὁ τῆς ἰδίας ἀλλότριος; Καὶ οὗτος τοίνυν εἰ πτωχεύει τῷ πνεύματι, πρὸς τὸν δι’ ἡμᾶς πτωχεύσαντα ἑκουσίως βλέπων, καὶ πρὸς τὸ τῆς φύσεως ὁμότιμον καθορῶν, μηδὲν ἐκ τῆς ἠπατημένης ἐκείνης περὶ ἀρχὴν τραγῳδίας εἰς τὸ ὁμογενὲς ἐξυβρίζοι, μακαριστὸς ἀληθῶς τῆς ταπεινοφροσύνης τῆς προσκαίρου, τὴν τῶν οὐρανῶν βασιλείαν ἀνταλλαξάμενος. Μὴ ἀποβάλῃς, ἀδελφὲ, καὶ τὸν ἕτερον τῆς πτωχείας λόγον, ὃς τοῦ κατ’ οὐρανὸν πλούτου πρόξενος γίνεται. Πώλησόν σου, φησὶ, πάντα τὰ ὑπάρχοντα, καὶ δὸς πτωχοῖς, καὶ δεῦρο, ἀκολούθει μοι, καὶ ἕξεις θησαυρὸν ἐν οὐρανοῖς. Καὶ γὰρ ἡ τοιαύτη πτωχεία δοκεῖ μοι μὴ ἀπᾴδειν τῆς μακαριζομένης πτωχείας. Ἰδοὺ πάντα, ὅσα εἴχομεν, ἀφέντες ἠκολουθήσαμέν σοι, φησὶ πρὸς τὸν Δεσπότην ὁ μαθητής· τί ἄρα ἔσται ἡμῖν; Καὶ τίς ἡ ἀπόκρισις; Μακάριοι οἱ πτωχοὶ τῷ πνεύματι, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν. Βούλει νοῆσαι, τίς ὁ πτωχεύων τῷ πνεύματι; Ὁ ἀνταλλαξάμενος τὸν τῆς ψυχῆς πλοῦτον τῆς σωματικῆς εὐπορίας, ὁ διὰ τὸ πνεῦμα πτωχεύων, ὁ τὸν γήϊνον πλοῦτον οἷόν τι βάρος ἀποσεισάμενος, ἵνα μετάρσιός τε καὶ διαέριος ἄνω φέρηται, καθώς φησιν ὁ Ἀπόστολος, ἐπὶ νεφέλης συμμετεωροπορῶν τῷ Θεῷ. Βαρύ τι χρῆμα τὸ χρυσίον ἐστὶν, βαρεῖα πᾶσα ἡ σπουδαζομένη κατὰ τὸν πλοῦτον ὕλη· κοῦφον δέ τι καὶ ἀνωφερὲς πρᾶγμα ἡ ἀρετή. Ἀλλὰ μὴν ἀντίκειται ταῦτα ἀλλήλοις, τὸ βάρος καὶ ἡ κουφότης. Οὐκοῦν ἀμήχανόν τινα γενέσθαι κοῦφον, τῷ βάρει τῆς ὕλης ἑαυτὸν προσηλώσαντα. Εἰ οὖν χρὴ τοῖς ἄνω προσβῆναι, τῶν κάτω καθελκόντων πτωχεύσωμεν, ἵνα ἐν τοῖς ἄνω γενώμεθα. Τίς δὲ ὁ τρόπος, ὑφηγεῖται ἡ ψαλμῳδία· Ἐσκόρπισεν, ἔδωκε τοῖς πένησιν, ἡ δικαιοσύνη αὐτοῦ μένει εἰς τὸν αἰῶνα τοῦ αἰῶνος. Ὁ τῷ πτωχῷ κοινωνήσας, εἰς τὴν μερίδα τοῦ δι’ ἡμᾶς πτωχεύσαντος ἑαυτὸν καταστήσει. Ἐπτώχευσεν ὁ Κύριος, μὴ φοβηθῇς μηδὲ σὺ τὴν πτωχείαν. Ἀλλὰ βασιλεύει πάσης τῆς κτίσεως ὁ δι’ ἡμᾶς πτωχεύσας. Οὐκοῦν ἐὰν πτωχεύσαντι συμπτωχεύσῃς, καὶ βασιλεύοντι συμβασιλεύσεις. Μακάριοι γὰρ οἱ πτωχοὶ τῷ πνεύματι, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν, ἧς καὶ ἡμεῖς ἀξιωθείημεν ἐν Χριστῷ Ἰησοῦ τῷ Κυρίῳ ἡμῶν, ᾧ ἡ δόξα καὶ τὸ κράτος, εἰς τοὺς αἰῶνας τῶν αἰώνων. Ἀμήν.
    `;

      function appendTokenizedContent(targetElement, text) {
        // Regex captures words (including Greek polytonic characters) vs everything else
        const tokens = text.split(/([A-Za-z\u0370-\u03FF\u1F00-\u1FFF]+)/g);

        tokens.forEach((token) => {
          // Test if token is a Greek/Latin character word
          if (/^[A-Za-z\u0370-\u03FF\u1F00-\u1FFF]+$/.test(token)) {
            const link = document.createElement("a");
            link.className = "lsj-word";
            link.textContent = token;

            // Route to Logeion dictionary which parses inflected forms flawlessly
            link.href = `https://logeion.uchicago.edu/${encodeURIComponent(token.toLowerCase())}`;
            link.target = "_blank"; // Opens in a new tab

            targetElement.appendChild(link);
          } else {
            // Append spacing and punctuation as normal text node
            targetElement.appendChild(document.createTextNode(token));
          }
        });
      }

      function splitIntoSentences(text) {
        const normalized = text.replace(/\s+/g, " ").trim();
        if (!normalized) return [];

        // Keep sentence boundaries deterministic using punctuation-based splitting.
        return normalized
          .split(/(?<=[\.;!?;])\s+/u)
          .map((part) => part.trim())
          .filter(Boolean);
      }

      function processText(text) {
        const container = document.getElementById("text-content");
        container.classList.add("sentence-numbered-text");

        const paragraphs = text.trim().split(/\n\s*\n/);

        paragraphs.forEach((paragraph) => {
          let paraText = paragraph.trim();
          if (!paraText) return;

          const isQuote =
            paraText.startsWith("[quote]") && paraText.endsWith("[/quote]");

          if (isQuote) {
            paraText = paraText
              .replace(/^\[quote\]/, "")
              .replace(/\[\/quote\]$/, "")
              .trim();
          }

          const sentences = splitIntoSentences(paraText);

          const paragraphContainer = document.createElement("div");
          paragraphContainer.className = "text-paragraph";

          if (isQuote) {
            paragraphContainer.classList.add("quote");
          }

          sentences.forEach((sentenceText) => {
            const sentence = document.createElement("span");
            sentence.className = "sentence";

            const content = document.createElement("span");
            content.className = "sentence-content";
            appendTokenizedContent(content, sentenceText);

            sentence.appendChild(content);
            paragraphContainer.appendChild(sentence);
          });

          container.appendChild(paragraphContainer);
        });
      }

      // Initialize parsing
      processText(rawText);
    </script>
