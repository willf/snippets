<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviation Phonetic Translator</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --accent-color: #0056b3;
            --card-bg: #ffffff;
            --border-color: #d1d5db;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--accent-color);
        }

        .input-group {
            margin-bottom: 25px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.1);
        }

        .output-box {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            min-height: 100px;
            font-size: 1.1rem;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .output-box span {
            display: inline-block;
            background: #e2e8f0;
            padding: 2px 6px;
            border-radius: 4px;
            margin: 2px;
            font-size: 0.95rem;
        }

        .punctuation {
            background: transparent !important;
            padding: 0 !important;
            margin: 0 !important;
        }

        button {
            padding: 6px 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #004494;
        }

        /* ICAO Reference Section Styles */
        .reference-section {
            margin-top: 35px;
            padding-top: 25px;
            border-top: 1px solid var(--border-color);
        }

        .reference-section h2 {
            font-size: 1.2rem;
            color: var(--text-color);
            margin-bottom: 15px;
            text-align: center;
        }

        .reference-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 10px;
        }

        .reference-item {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px;
            text-align: center;
            font-size: 0.9rem;
        }

        .reference-item strong {
            display: block;
            color: var(--accent-color);
            font-size: 1.1rem;
            margin-bottom: 2px;
        }

        /* Mobile adjustments */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 20px;
            }
            .header-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Phonetic Translator</h1>
    
    <!-- Input Section -->
    <div class="input-group">
        <label for="inputText">Enter your phrase:</label>
        <textarea id="inputText" placeholder="Type here..."></textarea>
    </div>

    <!-- Output Section 1: Standard -->
    <div class="input-group">
        <div class="header-row">
            <label>Aviation Standard:</label>
            <button onclick="copyText('outputStandard', this)">Copy Standard</button>
        </div>
        <div id="outputStandard" class="output-box"></div>
    </div>

    <!-- Output Section 2: Verbose -->
    <div class="input-group">
        <div class="header-row">
            <label>Verbose Format (A as in Alfa):</label>
            <button onclick="copyText('outputVerbose', this)">Copy Verbose</button>
        </div>
        <div id="outputVerbose" class="output-box"></div>
    </div>

    <!-- ICAO Reference Section -->
    <div class="reference-section">
        <h2>ICAO Standard Reference</h2>
        <div id="referenceGrid" class="reference-grid">
            <!-- Grid items will be generated by JavaScript -->
        </div>
    </div>
</div>

<script>
    // Standard NATO / Aviation Phonetic Alphabet (Strict ICAO spellings)
    const natoAlphabet = {
        'A': 'Alfa', 'B': 'Bravo', 'C': 'Charlie', 'D': 'Delta', 'E': 'Echo', 
        'F': 'Foxtrot', 'G': 'Golf', 'H': 'Hotel', 'I': 'India', 'J': 'Juliett', 
        'K': 'Kilo', 'L': 'Lima', 'M': 'Mike', 'N': 'November', 'O': 'Oscar', 
        'P': 'Papa', 'Q': 'Quebec', 'R': 'Romeo', 'S': 'Sierra', 'T': 'Tango', 
        'U': 'Uniform', 'V': 'Victor', 'W': 'Whiskey', 'X': 'X-ray', 'Y': 'Yankee', 'Z': 'Zulu',
        '0': 'Zero', '1': 'One', '2': 'Two', '3': 'Three', '4': 'Four', 
        '5': 'Fife', '6': 'Six', '7': 'Seven', '8': 'Eight', '9': 'Niner'
    };

    const inputText = document.getElementById('inputText');
    const outputStandard = document.getElementById('outputStandard');
    const outputVerbose = document.getElementById('outputVerbose');
    const referenceGrid = document.getElementById('referenceGrid');

    // Populate the reference grid automatically
    let gridHTML = '';
    for (const [letter, word] of Object.entries(natoAlphabet)) {
        gridHTML += `
            <div class="reference-item">
                <strong>${letter}</strong>
                ${word}
            </div>
        `;
    }
    referenceGrid.innerHTML = gridHTML;

    // Real-time translation function
    inputText.addEventListener('input', () => {
        const text = inputText.value.toUpperCase();
        let standardHTML = '';
        let verboseHTML = '';

        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            
            if (natoAlphabet[char]) {
                // Format 1: "Alfa"
                standardHTML += `<span>${natoAlphabet[char]}</span>`;
                // Format 2: "A as in Alfa"
                verboseHTML += `<span>${char} as in ${natoAlphabet[char]}</span>`;
            } else if (char === ' ') {
                standardHTML += ' &nbsp;&nbsp; '; // Visual space
                verboseHTML += ' &nbsp;&nbsp; ';
            } else if (char === '\n') {
                standardHTML += '<br>';
                verboseHTML += '<br>';
            } else {
                // Keep punctuation as-is
                standardHTML += `<span class="punctuation">${char}</span>`; 
                verboseHTML += `<span class="punctuation">${char}</span>`; 
            }
        }

        outputStandard.innerHTML = standardHTML;
        outputVerbose.innerHTML = verboseHTML;
    });

    // Reusable Copy function
    function copyText(elementId, btnElement) {
        const targetElement = document.getElementById(elementId);
        // Extract plain text and normalize non-breaking spaces
        const plainText = targetElement.innerText.replace(/\u00a0/g, " "); 
        
        if (!plainText.trim()) return;

        navigator.clipboard.writeText(plainText).then(() => {
            const originalText = btnElement.innerText;
            btnElement.innerText = 'Copied!';
            btnElement.style.backgroundColor = '#28a745'; // Green success color
            
            setTimeout(() => {
                btnElement.innerText = originalText;
                btnElement.style.backgroundColor = ''; // Revert to original
            }, 2000);
        });
    }
</script>

</body>
</html>
