<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heavy Tail Distribution Fitter (4 Models)</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 20px; background: #f8f9fa; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        textarea { width: 100%; height: 150px; padding: 10px; border: 1px solid #ccc; font-family: monospace; box-sizing: border-box; }
        button { background: #0056b3; color: white; border: none; padding: 10px 20px; font-size: 1rem; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #004494; }
        .chart-container { margin-top: 30px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ddd; }
        th { background: #f1f3f5; }
        .best-fit { background: #d4edda; font-weight: bold; }
        .error { color: #dc3545; font-weight: bold; margin-top: 10px;}
        .axis text { font-size: 12px; }
        .axis path, .axis line { stroke: #ccc; }
        .data-point { fill: rgba(0, 86, 179, 0.6); stroke: #0056b3; stroke-width: 1px;}
    </style>
</head>
<body>

<div class="container">
    <h1>Distribution Fitter & KS Test (4 Models)</h1>
    <p>Paste up to 1,000 numeric values. You can separate them using commas, spaces, or newlines.</p>
    <textarea id="dataInput">
10000
5000, 3333
2500 2000 1666
1428, 1250, 1111, 1000, 909, 833, 769, 714, 666, 625, 588, 555, 526, 500
400, 350, 300, 250, 200, 150, 100, 90, 80, 70, 60, 50, 40, 30, 20, 10
5, 5, 4, 4, 3, 3, 2, 2, 2, 2
1, 1, 1, 1, 1, 1, 1, 1
    </textarea>
    <button onclick="analyzeData()">Analyze Distribution</button>
    <div id="errorMsg" class="error"></div>
    <div class="chart-container" id="chart"></div>
    <table id="resultsTable">
        <thead>
            <tr><th>Distribution</th><th>Estimated Parameters</th><th>KS Statistic (D)</th></tr>
        </thead>
        <tbody id="resultsBody"></tbody>
    </table>
</div>

<script>
// --- Math Utilities ---
function erf(x) {
    const sign = (x >= 0) ? 1 : -1;
    x = Math.abs(x);
    const a1 = 0.254829592, a2 = -0.284496736, a3 = 1.421413741, a4 = -1.453152027, a5 = 1.061405429, p = 0.3275911;
    const t = 1.0 / (1.0 + p * x);
    return sign * (1.0 - (((((a5 * t + a4) * t) + a3) * t + a2) * t + a1) * t * Math.exp(-x * x));
}

function powerLawCDF(x, xmin, alpha) {
    if (x < xmin) return 0;
    return 1 - Math.pow(xmin / x, alpha - 1);
}

function logNormalCDF(x, mu, sigma) {
    if (x <= 0) return 0;
    return 0.5 + 0.5 * erf((Math.log(x) - mu) / (sigma * Math.SQRT2));
}

function zipfianContinuousCDF(k, n, s) {
    if (Math.abs(s - 1.0) < 0.0001) {
        return Math.log(k) / Math.log(n);
    } else {
        return (Math.pow(k, 1 - s) - 1) / (Math.pow(n, 1 - s) - 1);
    }
}

function exponentialCDF(x, lambda) {
    if (x < 0) return 0;
    return 1 - Math.exp(-lambda * x);
}

// --- Main Analysis ---
function analyzeData() {
    document.getElementById('errorMsg').innerText = '';
    const rawInput = document.getElementById('dataInput').value;
    
    // Updated Parsing: Splits by any character that is not a digit or a period
    let data = rawInput.split(/[^0-9.]+/)
        .map(d => parseFloat(d))
        .filter(d => !isNaN(d) && d > 0);
        
    if (data.length > 1000) data = data.slice(0, 1000);
    const n = data.length;
    if (n < 5) return document.getElementById('errorMsg').innerText = "Provide at least 5 valid positive numbers.";

    // 1. Sort strictly descending (Highest = Rank 1)
    data.sort((a, b) => b - a);
    const xmin = data[n - 1]; 

    // Calculate True Value ECDF (handles duplicate values in the tail)
    const valueEcdfMap = new Map();
    const freq = new Map();
    data.forEach(x => freq.set(x, (freq.get(x) || 0) + 1));
    let cumulative = 0;
    // Iterate backwards from smallest to largest to build CDF
    for (let i = n - 1; i >= 0; i--) {
        const x = data[i];
        if (!valueEcdfMap.has(x)) {
            cumulative += freq.get(x);
            valueEcdfMap.set(x, cumulative / n);
        }
    }

    // 2. Parameter Estimation
    let sumLnX_Xmin = 0, sumLnX = 0, sumLnK = 0, sumLnV = 0, sumX = 0;
    
    for (let i = 0; i < n; i++) {
        const x = data[i];
        const k = i + 1; // Rank 1 to N
        sumLnX_Xmin += Math.log(x / xmin);
        sumLnX += Math.log(x);
        sumLnK += Math.log(k);
        sumLnV += Math.log(x);
        sumX += x;
    }
    
    // Power Law
    const alpha = 1 + n / sumLnX_Xmin;
    
    // Log-Normal
    const mu = sumLnX / n;
    let sqDiffSum = 0;
    for(let i=0; i<n; i++) sqDiffSum += Math.pow(Math.log(data[i]) - mu, 2);
    const sigma = Math.sqrt(sqDiffSum / n);
    
    // Exponential
    const lambda = n / sumX;
    
    // Zipfian Exponent (s) via OLS of log(Rank) vs log(Value)
    const meanLnK = sumLnK / n;
    const meanLnV = sumLnV / n;
    let num = 0, den = 0;
    for (let i = 0; i < n; i++) {
        const lnK = Math.log(i + 1);
        const lnV = Math.log(data[i]);
        num += (lnK - meanLnK) * (lnV - meanLnV);
        den += Math.pow(lnK - meanLnK, 2);
    }
    const s = -(num / den); 

    // 3. Dual KS Test Loop
    let ksPowerLaw = 0, ksLogNormal = 0, ksZipfian = 0, ksExponential = 0;

    for (let i = 0; i < n; i++) {
        const x = data[i];
        const k = i + 1;

        // Value-based KS testing (Power Law, Log-Normal, Exponential)
        const ecdfValue = valueEcdfMap.get(x);
        
        const dPL = Math.abs(ecdfValue - powerLawCDF(x, xmin, alpha));
        if (dPL > ksPowerLaw) ksPowerLaw = dPL;
        
        const dLN = Math.abs(ecdfValue - logNormalCDF(x, mu, sigma));
        if (dLN > ksLogNormal) ksLogNormal = dLN;
        
        const dExp = Math.abs(ecdfValue - exponentialCDF(x, lambda));
        if (dExp > ksExponential) ksExponential = dExp;

        // Rank-based KS testing (Zipfian)
        const ecdfRank = k / n;
        const dZipf = Math.abs(ecdfRank - zipfianContinuousCDF(k, n, s));
        if (dZipf > ksZipfian) ksZipfian = dZipf;
    }

    // 4. Output
    const results = [
        { name: "Power Law", params: `α = ${alpha.toFixed(3)}, x_min = ${xmin}`, ks: ksPowerLaw },
        { name: "Log-Normal", params: `μ = ${mu.toFixed(3)}, σ = ${sigma.toFixed(3)}`, ks: ksLogNormal },
        { name: "Exponential", params: `λ = ${lambda.toFixed(6)}`, ks: ksExponential },
        { name: "Zipfian (Rank)", params: `s = ${s.toFixed(4)}`, ks: ksZipfian }
    ];

    results.sort((a, b) => a.ks - b.ks);
    const tbody = document.getElementById('resultsBody');
    tbody.innerHTML = '';
    results.forEach((r, index) => {
        const tr = document.createElement('tr');
        if (index === 0) tr.className = 'best-fit';
        tr.innerHTML = `<td>${r.name} ${index === 0 ? '🏆' : ''}</td><td>${r.params}</td><td>${r.ks.toFixed(4)}</td>`;
        tbody.appendChild(tr);
    });

    drawChart(data, s);
}

// --- D3.js Charting ---
function drawChart(data, s) {
    d3.select("#chart").selectAll("*").remove();
    const rankData = data.map((val, i) => ({ rank: i + 1, value: val }));
    const width = 900, height = 400, margin = {top: 20, right: 50, bottom: 50, left: 60};
    const innerWidth = width - margin.left - margin.right;
    const innerHeight = height - margin.top - margin.bottom;

    const svg = d3.select("#chart").append("svg").attr("viewBox", `0 0 ${width} ${height}`).append("g").attr("transform", `translate(${margin.left},${margin.top})`);
    
    const xScale = d3.scaleLog().domain([1, d3.max(rankData, d => d.rank)]).range([0, innerWidth]);
    const yScale = d3.scaleLog().domain([d3.min(rankData, d => d.value), d3.max(rankData, d => d.value)]).range([innerHeight, 0]);

    svg.append("g").attr("transform", `translate(0,${innerHeight})`).call(d3.axisBottom(xScale).ticks(5, "~s"))
       .append("text").attr("x", innerWidth / 2).attr("y", 40).attr("fill", "black").style("text-anchor", "middle").text("Rank (Log Scale)");

    svg.append("g").call(d3.axisLeft(yScale).ticks(5, "~s"))
       .append("text").attr("transform", "rotate(-90)").attr("x", -innerHeight / 2).attr("y", -45).attr("fill", "black").style("text-anchor", "middle").text("Value (Log Scale)");

    svg.selectAll(".data-point").data(rankData).enter().append("circle").attr("class", "data-point").attr("cx", d => xScale(d.rank)).attr("cy", d => yScale(d.value)).attr("r", 4);
}

window.onload = analyzeData;
</script>
</body>
</html>
