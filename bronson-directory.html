<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hospital Directory</title>
    <meta
      name="description"
      content="I hate how the Bronson directory looks. This is a attempt at a revamp."
    />
    <style>
      /* Semantic CSS Variables for Theme */
      :root {
        --bg-main: #f4f4f4;
        --bg-white: #ffffff;
        --bg-gray-light: #f3f4f6;
        --bg-gray-med: #e5e7eb;
        --bg-gray-dark: #d1d5db;
        --text-dark: #000000;
        --text-gray-dark: #1f2937;
        --text-gray-med: #374151;
        --text-gray-light: #4b5563;
        --text-gray-lighter: #6b7280;
        --border-color: #d1d5db;
        --border-dark: #9ca3af;
        --font-sans:
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --font-serif:
          ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
      }

      /* Base Resets */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-main);
        color: var(--text-gray-dark);
        font-family: var(--font-sans);
      }

      /* Layout Structure */
      .app-wrapper {
        display: flex;
        flex-direction: column;
        height: 100vh;
        max-height: 100vh;
        overflow: hidden;
      }

      /* Header */
      .site-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        padding: 1.5rem 3rem;
        flex-shrink: 0;
      }

      .site-title {
        font-size: 1.875rem;
        font-family: var(--font-serif);
        color: var(--text-gray-med);
        letter-spacing: 0.025em;
        margin: 0;
        font-weight: normal;
      }

      .datetime-display {
        font-size: 1.5rem;
        color: var(--text-gray-med);
        font-family: var(--font-serif);
      }

      /* Main Content */
      .main-content {
        display: flex;
        flex-direction: column;
        flex: 1;
        overflow: hidden;
        padding: 0 2rem 1rem;
      }

      /* Map Section */
      .map-section {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: stretch;
        margin-bottom: 1.5rem;
        height: 33.333333%;
        flex-shrink: 0;
        background-color: var(--bg-white);
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        border: 1px solid var(--border-color);
        border-radius: 0.125rem;
      }

      .map-graphic-container {
        flex: 1;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        border-right: 1px solid var(--border-color);
        background-color: var(--bg-white);
      }

      .map-svg {
        width: 100%;
        height: 100%;
        max-height: 250px;
        filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.05));
      }

      .map-legend {
        width: 450px;
        padding: 1.5rem;
        overflow-y: auto;
        font-size: 0.875rem;
      }

      .legend-title {
        font-weight: 600;
        color: var(--text-gray-med);
        margin-top: 0;
        margin-bottom: 0.75rem;
        border-bottom: 1px solid var(--bg-gray-med);
        padding-bottom: 0.25rem;
      }

      .legend-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .legend-item {
        display: flex;
        align-items: flex-start;
      }

      .legend-key {
        font-weight: 700;
        color: var(--text-gray-dark);
        width: 1.5rem;
        flex-shrink: 0;
      }

      .legend-desc {
        color: var(--text-gray-light);
      }

      /* Directory Section */
      .directory-section {
        flex: 1;
        overflow: hidden;
        background-color: var(--bg-white);
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        border: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        border-radius: 0.125rem;
      }

      .directory-header {
        background-color: var(--bg-gray-med);
        padding: 0.75rem 1.5rem;
        border-bottom: 2px solid var(--border-dark);
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .directory-title {
        font-weight: 600;
        color: var(--text-gray-dark);
        font-size: 1.125rem;
        margin: 0;
      }

      .directory-list-wrapper {
        flex: 1;
        overflow: auto;
      }

      .directory-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
      }

      .directory-item {
        border-bottom: 1px solid var(--border-color);
        padding: 1rem 1.5rem;
        transition: background-color 0.15s ease-in-out;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
      }

      .directory-item:nth-child(even) {
        background-color: var(--bg-gray-light);
      }

      .directory-item:hover {
        background-color: var(--bg-gray-dark);
      }

      .practice-name {
        font-weight: 600;
        color: var(--text-dark);
        font-size: 1.125rem;
        margin: 0;
      }

      .practice-details {
        font-size: 0.9375rem;
        font-weight: 400;
        color: var(--text-gray-med);
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .badge-building {
        background-color: var(--bg-gray-dark);
        color: var(--text-dark);
        padding: 0.125rem 0.625rem;
        border-radius: 0.125rem;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 600;
      }

      .detail-separator {
        color: var(--text-gray-lighter);
      }

      .detail-suite {
        color: var(--text-dark);
        font-weight: 600;
      }

      /* Footer */
      .site-footer {
        margin-top: 1rem;
        padding-top: 0.75rem;
        border-top: 1px solid var(--border-color);
        text-align: center;
        font-size: 0.875rem;
        color: var(--text-gray-light);
        flex-shrink: 0;
        font-weight: 500;
        letter-spacing: 0.025em;
        padding-bottom: 0.5rem;
      }
    </style>
  </head>

                <!-- Corridors / Atrium -->
                <path

                <!-- West Pavilion & East Pavilion rough shapes -->

                <rect

                  width="50"
                  height="60"

              <!-- Labels -->

              <g fill="#000000" font-size="12" text-anchor="middle">

                <text x="60" y="130" font-size="10">Parking Ramp</text>
              </g>
            </svg>
          </div>

          <!-- Map Legend -->

            <h3 class="legend-title">Garden Entrance</h3>
            <ul id="map-legend-container" class="legend-list">
              <!-- Injected via JS -->
            </ul>
          </aside>
        </section>

        <!-- Directory List Section -->
        <section class="directory-section">
          <header class="directory-header">
            <h2 class="directory-title">Practices & Departments</h2>
          </header>
          <div class="directory-list-wrapper">
            <ul id="directory-list-container" class="directory-list">
              <!-- Injected via JS -->

        </section>

        <!-- Footer Legend -->
        <footer class="site-footer">
          Directory Legend: &nbsp;&nbsp; WP - West Pavilion &nbsp;&nbsp; EP -

      </main>
