scripts:
  - filename: combine_docs.py
    description: Combine sequential Markdown files and add page markers.
    show_on_index: true
  - filename: configure_sbl_greek_font.py
    description: Configure the SBL Greek font for local text and document workflows.
    show_on_index: true
  - filename: find_dupes.py
    description: Cluster likely duplicate names from JSONL input and write CSV results.
    show_on_index: true
  - filename: generate.py
    description: Regenerate this index page from the repository's HTML snippets and script manifest.
    show_on_index: true
  - filename: generate_pdf_from_html_page.py
    description: Generate a PDF from a local HTML page.
    show_on_index: true
  - filename: get_songs_by_leader.py
